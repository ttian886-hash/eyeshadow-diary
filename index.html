function classifyShadowColour(hex){
 if(typeof hex!=='string'||!/^#[0-9a-f]{6}$/i.test(hex))return null;
 let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
 let hi=Math.max(r,g,b),lo=Math.min(r,g,b),d=hi-lo;
 if(d<0.085)return 'neutral';
 let h=0;
 if(hi===r)h=((g-b)/d)%6;
 else if(hi===g)h=(b-r)/d+2;
 else h=(r-g)/d+4;
 h=(h*60+360)%360;
 if(h>=68&&h<172)return 'green';
 if(h>=172&&h<266)return 'purple';
 if(h>=266&&h<330)return h<290?'purple':'pink';
 if(h>=330||h<12)return (r-b<0.13&&r-g<0.17)?'pink':'pink';
 if(h>=12&&h<48)return 'neutral';
 if(h>=48&&h<68)return 'neutral';
 return 'neutral';
}

 overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});overlay.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.remove()});panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');heading.id='archive-choice-title';panel.setAttribute('aria-labelledby','archive-choice-title');
 document.body.appendChild(overlay);select.focus();
}
function setArchiveReason(id,reason){const x=data.find(v=>v.id===id);if(!x||!x.archived)return;x.archiveReason=['finished','discarded','not_using'].includes(reason)?reason:'not_using';delete x.autoArchivedFinished;persist();render();toast('Archive status updated')}
function hitPan(id){lastSave=null;let x=data.find(v=>v.id===id);x.hitPan=x.hitPan?'':new Date().toISOString().slice(0,10);persist();render();toast(x.hitPan?'Hit Pan recorded':'Hit Pan removed')};

// v46: User-provided reference photographs: physical pan layout and approximate base colours.
// Keep product uses, individual shadeUses, history and archive flags unchanged.
(function applyPhotoPaletteV46(){
 const patches={
  'Viseart|Violette Etendu':{cols:4,colors:['#E5C4BD','#E7A6B2','#B78B8A','#D3B5AA','#D8ACDC','#74487F','#B39AB9','#BD6EAF','#69536A','#826776','#B18B8C','#503943'],note:'Owner reference photograph: three rows of four approximately square pans; metallic finishes simplified to flat colour.'},
  'Viseart|Paris Edit':{cols:4,colors:['#D9AFB6','#E2D5BB','#B9806E','#80545F','#C8899B','#C78B72','#D47F7C','#713C47','#62545F','#A46A55','#D4A098','#75506F'],note:'Owner reference photograph: three rows of four approximately square pans; shade names remain in existing order, not independently verified against photo.'},
  'Charlotte Tilbury|Star in your eyes':{cols:12,colors:['#E6D6C9','#CB8D80','#B97F7A','#CDA68C','#DDC4A7','#A36F53','#BC7181','#B5767C','#80616B','#C68C8F','#8E4A70','#68465F'],note:'Owner reference photograph: 12 narrow vertical pans in one row, grouped into Love, Power, Happy, Confident Eyes trios.'},
  'Nars|Skin Deep':{cols:4,colors:['#F0D9B5','#98716D','#875B4D','#A1877E','#7C6463','#D6A98D','#C99B94','#433634','#CBB6A9','#C7A17B','#B66A60','#80645D'],note:'Owner reference photograph: 3x4 pans; first row taller vertical rectangles, lower two rows horizontal rectangles. Names retained in existing order.'},
  'Melt|She’s in Parties':{cols:8,colors:['#E5C7A5','#B89A9C','#E8CCD1','#B58A93','#A35B55','#975365','#713744','#79535C'],note:'Owner reference photo: eight narrow vertical pans across one row; dimensions tuned to product photograph.'}

// v89: make internal screens part of the browser's navigation history.
window.history.replaceState({diaryPage:page,diarySerial:0},'',location.href);
window.addEventListener('popstate',event=>{
 const target=event.state&&event.state.diaryPage;
 if(!target||!['home','collection','pick','detail','add','edit','stats','history'].includes(target))return;
 window.__diaryRestoringNavigation=true;
 try{go(target)}finally{window.__diaryRestoringNavigation=false}
});
// v89: pull down from the very top to refresh. Do not intercept normal scrolling,
// inputs, or horizontal swipes; preserve the current screen and archive filters.
(function enablePullRefresh(){
 let startX=0,startY=0,tracking=false,pulled=false;
 const indicator=document.createElement('div');indicator.id='diary-pull-refresh';
 indicator.setAttribute('aria-live','polite');indicator.textContent='↓ Pull to refresh';
 document.body.appendChild(indicator);
 const reset=()=>{tracking=false;pulled=false;indicator.classList.remove('visible','ready')};
 document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return reset();
  const target=e.target;
  if(target.closest('input,textarea,select,[contenteditable="true"],.modal,[role="dialog"]'))return reset();
  tracking=(window.scrollY||document.documentElement.scrollTop||0)<=1;
  startX=e.touches[0].clientX;startY=e.touches[0].clientY;pulled=false;
 },{passive:true});
 document.addEventListener('touchmove',e=>{
  if(!tracking||e.touches.length!==1)return;
  const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
  if(Math.abs(dx)>Math.abs(dy)*0.8||dy<0){reset();return}
  pulled=dy>95;
  if(dy>35){indicator.classList.add('visible');indicator.classList.toggle('ready',pulled);indicator.textContent=pulled?'↻ Release to refresh':'↓ Pull to refresh'}
 },{passive:true});
 document.addEventListener('touchend',()=>{
  if(tracking&&pulled){
   indicator.textContent='↻ Refreshing…';
   try{sessionStorage.setItem('diary_v90_refresh_view',JSON.stringify({
    page,showArchived,archiveCategory,collectionView,activeProduct,
    historyTab,collectionVisibleCount,chosen,query,brandFilter,countFilter,
    statsProductFilter,scrollX:window.scrollX||0,scrollY:window.scrollY||document.documentElement.scrollTop||0,
    historyView:typeof historyView!=='undefined'?historyView:null
   }))}catch(e){}
   location.reload();
  }else reset();
 },{passive:true});
 document.addEventListener('touchcancel',reset,{passive:true});
})();
// v91: right-edge left swipe = back. At Archive root, go to Home.
// Ignore gestures starting on controls or horizontal palette/carousel elements.
(function enableEdgeSwipeBack(){
 let x0=0,y0=0,armed=false;
 document.addEventListener('touchstart',e=>{
  armed=false;
  if(e.touches.length!==1)return;
  const t=e.touches[0],w=window.innerWidth;
  if(t.clientX<w-72||t.clientX>w-4)return;
  if(e.target.closest('input,textarea,select,button,[contenteditable],.modal,.palette,.mini-palette,.moodgrid,.history-switch'))return;
  x0=t.clientX;y0=t.clientY;armed=true;
 },{passive:true});
 document.addEventListener('touchend',e=>{
  if(!armed||e.changedTouches.length!==1)return;
  armed=false;
  const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
  if(dx>-85||Math.abs(dx)<Math.abs(dy)*1.6)return;
  if(page==='home')return;
  if(page==='collection'&&showArchived){
   // Archive is the final internal stop: the next gesture opens Home.
   showArchived=false;archiveCategory='all';collectionView='all';
   go('home');return;
  }
  if(window.history.state&&window.history.state.diarySerial>0){window.history.back()}
  else if(page==='detail'||page==='pick'||page==='add'||page==='edit'){go('collection')}
  else{go('home')}
 },{passive:true});
 document.addEventListener('touchcancel',()=>{armed=false},{passive:true});
})();
// v90: restore the exact internal view, filters, expansion and scroll position
// after intentional pull refresh. Only session UI state is stored; collection data is untouched.
let diaryRefreshScroll=null;
try{
 const saved=sessionStorage.getItem('diary_v90_refresh_view')||sessionStorage.getItem('diary_v89_refresh_view');
 if(saved){
  sessionStorage.removeItem('diary_v90_refresh_view');
  sessionStorage.removeItem('diary_v89_refresh_view');
  const v=JSON.parse(saved);
  if(typeof v.showArchived==='boolean')showArchived=v.showArchived;
  if(['all','not_using','finished'].includes(v.archiveCategory))archiveCategory=v.archiveCategory;
  if(['all','frequent'].includes(v.collectionView))collectionView=v.collectionView;
  if(typeof v.activeProduct==='string')activeProduct=v.activeProduct;
  if(typeof v.historyTab==='string')historyTab=v.historyTab==='pan'||v.historyTab==='milestones'?'pan':'looks';
  if(Number.isFinite(v.collectionVisibleCount))collectionVisibleCount=Math.max(6,Math.floor(v.collectionVisibleCount));else if(v.collectionExpanded===true)collectionVisibleCount=16;
  if(typeof v.chosen==='string')chosen=v.chosen;
  if(typeof v.query==='string')query=v.query;
  if(typeof v.brandFilter==='string')brandFilter=v.brandFilter;
  if(typeof v.countFilter==='string')countFilter=v.countFilter;
  if(typeof v.statsProductFilter==='string')statsProductFilter=v.statsProductFilter;
  if(v.historyView!==null&&typeof historyView!=='undefined')historyView=v.historyView;
  if(['home','collection','pick','detail','add','edit','stats','history','history-edit','history-legacy-edit'].includes(v.page))page=v.page;
  if(Number.isFinite(v.scrollY))diaryRefreshScroll={x:Number(v.scrollX)||0,y:Math.max(0,v.scrollY)};
  window.history.replaceState({diaryPage:page,diarySerial:0},'',location.href);
 }
}catch(e){console.warn('Refresh view restoration skipped',e)}

render();
if(diaryRefreshScroll){
 const pos=diaryRefreshScroll;
 const restore=()=>window.scrollTo(pos.x,pos.y);
 requestAnimationFrame(()=>requestAnimationFrame(restore));
 window.addEventListener('load',restore,{once:true});
}
