async function importInventory(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.data)||!obj.data.every(x=>typeof x.id==='string'&&typeof x.brand==='string'&&typeof x.name==='string'&&['single','palette'].includes(x.type))){throw Error('Invalid backup format')}if(!confirm('Replace current inventory and history with this backup? Export a backup first.'))return;data=obj.data;history=Array.isArray(obj.history)?obj.history:[];lastSave=null;selected=[];persist();go('collection');toast('Backup imported')}catch(e){alert('Could not import backup: '+e.message)}}

function classifyShadowColour(hex){
 if(typeof hex!=='string'||!/^#[0-9a-f]{6}$/i.test(hex))return null;
 let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
 let hi=Math.max(r,g,b),lo=Math.min(r,g,b),d=hi-lo;
 if(d<0.085)return 'neutral';
 let h=0;
 if(hi===r)h=((g-b)/d)%6;
 else if(hi===g)h=(b-r)/d+2;
 else h=(r-g)/d+4;
 h=(h*60+360)%360;
 if(h>=68&&h<172)return 'green';
 if(h>=172&&h<266)return 'purple';
 if(h>=266&&h<330)return h<290?'purple':'pink';
 if(h>=330||h<12)return (r-b<0.13&&r-g<0.17)?'pink':'pink';
 if(h>=12&&h<48)return 'neutral';
 if(h>=48&&h<68)return 'neutral';
 return 'neutral';
}

// Legacy records have display labels but no reliable product/shade IDs.
// Allow corrections to their notes and removal from the journal without changing totals.
function editLegacyHistory(index){
 const h=history[index];if(!h||h.id&&Array.isArray(h.selection))return;
 const current=Array.isArray(h.items)?h.items.join(' · '):'';
 const edited=prompt('Edit this older look’s notes. Usage counts will not change.',current);
 if(edited===null)return;
 h.items=edited.trim()?edited.split(/\s*·\s*/).map(x=>x.trim()).filter(Boolean):[];
 persist();render();toast('History notes updated');
}
// Older history entries contain text labels rather than stable shade IDs.
// Their individual entries are editable, but we never invent usage-count adjustments.
function startLegacyHistoryEdit(index){
 const h=history[index];if(!h||h.id&&Array.isArray(h.selection))return;
 legacyEditIndex=index;legacyDraftItems=Array.isArray(h.items)?[...h.items]:[];
 go('history-legacy-edit');
}
function legacyShadeLabel(x,index){return x.name+(x.type==='palette'?' '+x.shades[index][0]:'')}
function renderLegacyDraft(){
 const target=el('legacy-draft-list');if(!target)return;
 target.innerHTML=legacyDraftItems.map((label,i)=>`<div class="history-shade-row"><span>${escapeHtml(label)}</span><button type="button" class="tiny" onclick="removeLegacyShade(${i})">Remove</button></div>`).join('')||'<p class="sub">No shades selected</p>';
}
function removeLegacyShade(index){legacyDraftItems.splice(index,1);renderLegacyDraft();renderLegacyShadeOptions()}
function renderLegacyShadeOptions(){
 const x=data.find(v=>v.id===el('history-product')?.value),target=el('history-pan-panel');if(!target)return;
 if(!x){target.innerHTML='';return}
 const shades=x.type==='single'?[[x.name,x.color]]:x.shades;
 const special=x.brand==='Kevyn Aucoin'&&x.name==='Unblinking'?'kevyn-unblinking':x.brand==='Dior'&&x.name==='669 Soft Cashmere'?'dior-quint':x.brand==='Chanel'&&x.name==='Medium'?'chanel-medium':x.brand==='Clé de peau'&&x.name==='303'?'cdp-303':'';
 const cols=x.reviewedLayout?`grid-template-columns:repeat(${x.reviewedLayout},minmax(0,1fr))`:'';
 target.innerHTML=`<div class="palette ${special}" style="${cols}">${shades.map((shade,i)=>{const label=legacyShadeLabel(x,i),checked=legacyDraftItems.includes(label);return `<button type="button" aria-pressed="${checked}" class="shade ${checked?'selected':''}" onclick="toggleLegacyShade('${x.id}',${i})"><i class="pan-color" style="background:${shade[1]}">${checked?'<span class="pan-check">✓</span>':''}</i><small>${escapeHtml(shade[0])}</small></button>`}).join('')}</div>`;
}
function toggleLegacyShade(id,index){
 const x=data.find(v=>v.id===id);if(!x)return;
 const label=legacyShadeLabel(x,index),at=legacyDraftItems.indexOf(label);
 if(at>=0)legacyDraftItems.splice(at,1);else legacyDraftItems.push(label);
 renderLegacyDraft();renderLegacyShadeOptions();
}
function saveLegacyHistoryEdit(){
 const h=history[legacyEditIndex];if(!h)return;
 h.items=[...legacyDraftItems];persist();go('history');toast('Look updated ✦');
}
// Resolve old text-only records only when every shade has a unique identity.
function resolveLegacySelection(h){
 if(!Array.isArray(h.items)||!h.items.length)return null;
 const result=[];
 for(const raw of h.items){
  const label=String(raw).trim(),matches=[];
  for(const x of data){
   if(x.type==='single'){
    if(label===x.name||label===x.brand+' '+x.name)matches.push({id:x.id,index:0});
   }else if(Array.isArray(x.shades)){
    x.shades.forEach((shade,index)=>{
     if(label===x.name+' '+shade[0]||label===x.brand+' '+x.name+' '+shade[0])matches.push({id:x.id,index});
    });
   }
  }
  if(matches.length!==1)return null;
  if(!result.some(v=>v.id===matches[0].id&&v.index===matches[0].index))result.push(matches[0]);
 }
 return result.length?result:null;
}
function deleteLegacyHistory(index){
 const h=history[index];if(!h||(h.id&&Array.isArray(h.selection)))return;
 const selection=resolveLegacySelection(h);
 if(!selection){alert('This older record has no reliable shade IDs. Its usage counts cannot be safely deducted, so nothing was deleted.');return;}
 if(!confirm('Delete this older look and subtract 1 use from each selected shade and product?'))return;
 const beforeTotal=data.reduce((sum,x)=>sum+(Number(x.uses)||0),0);
 if(!historyDelta(selection,[])){alert('Cannot safely delete: one or more usage counts are already zero. No changes were made.');return;}
 history.splice(index,1);lastSave=null;persist();
 pendingHistoryStatsDelta+=data.reduce((sum,x)=>sum+(Number(x.uses)||0),0)-beforeTotal;
 go('history');toast('Look and usage counts updated ✦');
}
function validHistorySelection(sel){return Array.isArray(sel)&&sel.every(v=>{const x=data.find(p=>p.id===v.id);return x&&Number.isInteger(v.index)&&v.index>=0&&(x.type==='single'?v.index===0:Array.isArray(x.shades)&&v.index<x.shades.length)})}
function historyDelta(oldSel,newSel){
 if(!validHistorySelection(oldSel)||!validHistorySelection(newSel))return false;
 const productIds=sel=>new Set(sel.map(v=>v.id));
 const before=productIds(oldSel),after=productIds(newSel);
 for(const id of new Set([...before,...after])){const x=data.find(v=>v.id===id),change=Number(after.has(id))-Number(before.has(id));if((Number(x.uses)||0)+change<0)return false}
 const counts=sel=>{let m=new Map();sel.forEach(v=>{let x=data.find(y=>y.id===v.id);if(x?.type==='palette'&&Array.isArray(x.shadeUses)){let key=v.id+'::'+v.index;m.set(key,(m.get(key)||0)+1)}});return m};
 const a=counts(oldSel),b=counts(newSel);
 for(const key of new Set([...a.keys(),...b.keys()])){const sep=key.lastIndexOf('::'),id=key.slice(0,sep),idx=Number(key.slice(sep+2)),x=data.find(v=>v.id===id);if(!x||!Array.isArray(x.shadeUses)||(Number(x.shadeUses[idx])||0)+(b.get(key)||0)-(a.get(key)||0)<0)return false}
 for(const id of new Set([...before,...after])){const x=data.find(v=>v.id===id);x.uses=(Number(x.uses)||0)+Number(after.has(id))-Number(before.has(id))}
 for(const key of new Set([...a.keys(),...b.keys()])){const sep=key.lastIndexOf('::'),x=data.find(v=>v.id===key.slice(0,sep)),idx=Number(key.slice(sep+2));x.shadeUses[idx]=(Number(x.shadeUses[idx])||0)+(b.get(key)||0)-(a.get(key)||0)}
 return true;
}
function historyItemLabels(sel){return sel.map(v=>{const x=data.find(p=>p.id===v.id);return x.name+(x.type==='palette'?` ${x.shades[v.index][0]}`:'')})}
function startHistoryEdit(id){const h=history.find(v=>v.id===id);if(!h||!validHistorySelection(h.selection)){toast('This record cannot be edited safely');return}historyEditingId=id;historyDraft=h.selection.map(v=>({...v}));go('history-edit')}
function renderHistoryShadeOptions(){
 const x=data.find(v=>v.id===el('history-product')?.value),target=el('history-pan-panel');if(!target)return;
 if(!x){target.innerHTML='';return}
 const shades=x.type==='single'?[[x.name,x.color]]:x.shades;
 const special=x.brand==='Kevyn Aucoin'&&x.name==='Unblinking'?'kevyn-unblinking':x.brand==='Dior'&&x.name==='669 Soft Cashmere'?'dior-quint':x.brand==='Chanel'&&x.name==='Medium'?'chanel-medium':x.brand==='Clé de peau'&&x.name==='303'?'cdp-303':'';
 const cols=x.reviewedLayout?`grid-template-columns:repeat(${x.reviewedLayout},minmax(0,1fr))`:'';
 target.innerHTML=`<div class="history-pan-help">Tap individual shades to select or deselect them.</div><div class="palette ${special}" style="${cols}">${shades.map((shade,i)=>{const checked=historyDraft.some(v=>v.id===x.id&&v.index===i);return `<button type="button" aria-pressed="${checked}" class="shade ${checked?'selected':''}" onclick="toggleHistoryShade('${x.id}',${i})"><i class="pan-color" style="background:${shade[1]}">${checked?'<span class="pan-check">✓</span>':''}</i><small>${escapeHtml(shade[0])}</small></button>`}).join('')}</div><div class="history-pan-count">${historyDraft.filter(v=>v.id===x.id).length} selected from this product</div>`;
}
function toggleHistoryShade(id,index){
 const at=historyDraft.findIndex(v=>v.id===id&&v.index===index);
 if(at>=0)historyDraft.splice(at,1);else historyDraft.push({id,index});
 renderHistoryDraft();renderHistoryShadeOptions();
}
function renderHistoryDraft(){const target=el('history-draft-list');if(!target)return;target.innerHTML=historyDraft.map((v,i)=>{const x=data.find(p=>p.id===v.id);return `<div class="history-shade-row"><span>${escapeHtml(x.brand+' · '+x.name+(x.type==='palette'?' · '+x.shades[v.index][0]:''))}</span><button type="button" class="tiny" onclick="removeHistoryShade(${i})">Remove</button></div>`}).join('')||'<p class="sub">No shades selected</p>'}
function removeHistoryShade(i){historyDraft.splice(i,1);renderHistoryDraft();renderHistoryShadeOptions()}
function addHistoryShade(){const id=el('history-product')?.value,index=Number(el('history-shade')?.value);if(!id||!Number.isInteger(index))return;if(historyDraft.some(v=>v.id===id&&v.index===index)){toast('Already selected');return}historyDraft.push({id,index});renderHistoryDraft()}
function saveHistoryEdit(){dismissQuickUndo();const beforeTotal=data.reduce((a,x)=>a+(Number(x.uses)||0),0);const h=history.find(v=>v.id===historyEditingId);if(!h||!historyDraft.length){toast('Choose at least one shade');return}if(!historyDelta(h.selection,historyDraft)){alert('Cannot change this look safely. Some products or usage counts have changed.');return}h.selection=historyDraft.map(v=>({...v}));h.items=historyItemLabels(h.selection);if(lastSave?.id===h.id)lastSave=null;persist();pendingHistoryStatsDelta+=data.reduce((a,x)=>a+(Number(x.uses)||0),0)-beforeTotal;go('history');toast('Look updated ✦')}
function deleteHistoryLook(id){dismissQuickUndo();const beforeTotal=data.reduce((a,x)=>a+(Number(x.uses)||0),0);const i=history.findIndex(h=>h.id===id);if(i<0||!validHistorySelection(history[i].selection)){toast('Cannot safely delete this record');return}if(!confirm('Delete this saved look and correct its usage counts?'))return;if(!historyDelta(history[i].selection,[])){alert('Cannot delete safely: usage counts or products have changed.');return}history.splice(i,1);if(lastSave?.id===id)lastSave=null;persist();pendingHistoryStatsDelta+=data.reduce((a,x)=>a+(Number(x.uses)||0),0)-beforeTotal;go('history');toast('Look deleted ✦')}

function toggleStatsUsage(button){const card=button.closest('.stats-scroll-card');const expanded=card.classList.toggle('stats-expanded');button.setAttribute('aria-expanded',String(expanded));button.innerHTML=expanded?'Show Less <span aria-hidden="true">↑</span>':'Show More <span aria-hidden="true">↓</span>';}
function toggleShade(id,index){let n=selected.findIndex(v=>v.id===id&&v.index===index);n>=0?selected.splice(n,1):selected.push({id,index});render()}function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1100)}let statsSaveBump=0;let statsChangeTimer=null;function showStatsChange(delta){if(statsChangeTimer)clearTimeout(statsChangeTimer);statsSaveBump=delta;if(delta)statsChangeTimer=setTimeout(()=>{statsSaveBump=0;const bump=document.querySelector('.total-save-bump');if(bump)bump.remove()},2400)}
function animateCount(element,end,duration=750,delta=null){
 if(!element)return;
 const start=delta===null?Math.max(0,end-1):end-delta;
 const began=performance.now();element.classList.remove('count-animate');void element.offsetWidth;element.classList.add('count-animate');
 function frame(now){if(!element.isConnected)return;const t=Math.min(1,(now-began)/duration);const eased=1-Math.pow(1-t,3);element.textContent=String(Math.round(start+(end-start)*eased));if(t<1)requestAnimationFrame(frame);else element.textContent=String(end)}
 requestAnimationFrame(frame);
}
let quickUndoTimer=null;let quickUndoId=null;
function saveLook(){if(!selected.length){toast('Select a shade first');return}
let ids=[...new Set(selected.map(v=>v.id))];
// Save exact previous values: undo restores the state, rather than assuming every count was numeric.
dismissQuickUndo();const transactionId='look_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
lastSave={id:transactionId,productCounts:ids.map(id=>{let x=data.find(v=>v.id===id);return {id,uses:x?.uses??0}}),shadeCounts:selected.filter(v=>{let x=data.find(y=>y.id===v.id);return x&&x.type==='palette'&&Array.isArray(x.shadeUses)}).map(v=>{let x=data.find(y=>y.id===v.id);return {id:v.id,index:v.index,uses:x.shadeUses[v.index]??0}}),selection:selected.map(v=>({...v}))};
ids.forEach(id=>{let x=data.find(v=>v.id===id);if(x)x.uses=(Number(x.uses)||0)+1});
selected.forEach(v=>{let x=data.find(y=>y.id===v.id);if(x&&x.type==='palette'&&Array.isArray(x.shadeUses))x.shadeUses[v.index]=(Number(x.shadeUses[v.index])||0)+1});
history.push({id:transactionId,selection:selected.map(v=>({...v})),date:new Date().toLocaleDateString('en-GB'),items:selected.map(v=>{let x=data.find(y=>y.id===v.id);return x.name+(x.type==='palette'?` ${x.shades[v.index][0]}`:'')})});
recentlySavedIds=ids;showStatsChange(ids.length);selected=[];persist();
// First animate the product total on its detail page; then animate the overall total in Statistics.
render();
const detailPlus=document.getElementById('detail-plus');if(detailPlus){detailPlus.innerHTML=`<span class="detail-save-plus">+1</span>`;}
const detailCount=document.getElementById('detail-uses');
if(detailCount){detailCount.textContent=String((Number(data.find(x=>x.id===activeProduct)?.uses)||0)-1);detailCount.classList.remove('count-animate');requestAnimationFrame(()=>animateCount(detailCount,Number(data.find(x=>x.id===activeProduct)?.uses)||0,650))}
toast('Look saved ✦');
setTimeout(()=>{go('stats');const statCount=document.getElementById('stats-total-number');if(statCount)animateCount(statCount,Number(statCount.dataset.total)||0,850,ids.length);showQuickUndo(transactionId)},1050);
setTimeout(()=>{statsSaveBump=0;const bump=document.querySelector('.total-save-bump');if(bump)bump.remove()},2400);
}
function dismissQuickUndo(){if(quickUndoTimer){clearTimeout(quickUndoTimer);quickUndoTimer=null}quickUndoId=null;document.getElementById('quick-undo-banner')?.remove()}
function showQuickUndo(id){
 dismissQuickUndo();if(!lastSave||lastSave.id!==id||page!=='stats')return;
 quickUndoId=id;
 const banner=document.createElement('div');banner.id='quick-undo-banner';banner.className='quick-undo-banner';
 banner.innerHTML='<span class="quick-undo-message"><span class="quick-undo-check">✓</span> Look saved</span><button type="button" class="quick-undo-action" onclick="quickUndoLastSave()">Undo</button>';
 document.body.appendChild(banner);
 quickUndoTimer=setTimeout(()=>dismissQuickUndo(),8000);
}
function quickUndoLastSave(){
 if(!quickUndoId||!lastSave||lastSave.id!==quickUndoId){dismissQuickUndo();return}
 undoLastLook(true);
}
function undoLastLook(skipConfirm=false){statsSaveBump=0;
 if(!lastSave){toast('No recent save to undo');return}
 const t=lastSave;
 const historyIndex=history.findIndex(h=>h.id===t.id);
 if(historyIndex<0||!t.productCounts.every(v=>data.some(x=>x.id===v.id))||!t.shadeCounts.every(v=>{let x=data.find(y=>y.id===v.id);return x&&Array.isArray(x.shadeUses)&&v.index<x.shadeUses.length})){
  toast('Cannot undo this save safely');return;
 }
 if(!skipConfirm&&!confirm('Undo your last saved look? This will restore its usage counts and remove the look from history.'))return;
 t.productCounts.forEach(v=>{data.find(x=>x.id===v.id).uses=v.uses});
 t.shadeCounts.forEach(v=>{data.find(x=>x.id===v.id).shadeUses[v.index]=v.uses});
 history.splice(historyIndex,1);
 selected=t.selection.filter(v=>data.some(x=>x.id===v.id));
 lastSave=null;recentlySavedIds=[];dismissQuickUndo();persist();render();if(page==='stats'){const total=data.reduce((a,x)=>a+(Number(x.uses)||0),0);animateCount(document.getElementById('stats-total-number'),total,650,-t.productCounts.length)}toast('Last save undone');
}
function undoLookButton(){return lastSave?'<div class="undo-look-wrap"><button type="button" class="undo-look-button" onclick="undoLastLook()" aria-label="Undo last saved look"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg><span>Undo Last Save</span></button></div>':''}
function showSavedPlusOne(n){let e=document.createElement('div');e.className='stat-plus-overlay';e.innerHTML='<span class="stat-plus-number">+1</span><span class="stat-plus-label">STATISTICS UPDATED</span>';document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}function archive(id){
 const x=data.find(v=>v.id===id);if(!x)return;
 if(x.archived){x.archived=false;delete x.archiveReason;persist();openActiveCollection();toast('Restored to Collection');return}
 // Select a reason from a dropdown; never require numeric entry.
 document.getElementById('archive-choice-overlay')?.remove();
 const overlay=document.createElement('div');overlay.id='archive-choice-overlay';overlay.className='archive-choice-overlay';
 const panel=document.createElement('div');panel.className='archive-choice-panel';
 const eyebrow=document.createElement('div');eyebrow.className='archive-choice-eyebrow';eyebrow.textContent='COLLECTION · ORGANISE';panel.appendChild(eyebrow);const heading=document.createElement('h3');heading.textContent='Move to Archive';panel.appendChild(heading);
 const description=document.createElement('p');description.className='archive-choice-product';description.textContent=x.brand+' · '+x.name;panel.appendChild(description);const hint=document.createElement('p');hint.className='archive-choice-hint';hint.textContent='Usage counts and look history will be preserved.';panel.appendChild(hint);
 const label=document.createElement('label');label.textContent='ARCHIVE REASON';label.htmlFor='archive-choice-reason';panel.appendChild(label);
 const select=document.createElement('select');select.id='archive-choice-reason';
 [['not_using','Not Using'],['finished','Finished / Discarded']].forEach(([value,name])=>{const opt=document.createElement('option');opt.value=value;opt.textContent=name;select.appendChild(opt)});
 const selectWrap=document.createElement('div');selectWrap.className='archive-choice-select-wrap';selectWrap.appendChild(select);panel.appendChild(selectWrap);
 const actions=document.createElement('div');actions.className='archive-choice-actions';
 const cancel=document.createElement('button');cancel.type='button';cancel.className='archive-choice-cancel';cancel.textContent='Cancel';cancel.onclick=()=>overlay.remove();
 const confirm=document.createElement('button');confirm.type='button';confirm.className='archive-choice-confirm';confirm.textContent='Move to Archive';
 confirm.onclick=()=>{const target=data.find(v=>v.id===id);if(!target){overlay.remove();return}target.archived=true;target.archiveReason=select.value;overlay.remove();persist();openActiveCollection();toast('Moved to Archive')};
 actions.append(cancel,confirm);panel.appendChild(actions);overlay.appendChild(panel);
 overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});overlay.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.remove()});panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');heading.id='archive-choice-title';panel.setAttribute('aria-labelledby','archive-choice-title');
 document.body.appendChild(overlay);select.focus();
}

 }
