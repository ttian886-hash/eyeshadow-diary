function shadeFamily(hex){
 if(!/^#[0-9a-f]{6}$/i.test(hex||''))return 'earth';
 let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
 let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
 if(d<.105)return 'earth';
 let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;
 let sat=d/(1-Math.abs(2*l-1)||1);
 if(sat<.14)return 'earth';
 if(h>=65&&h<170)return 'olive';
 if(h>=170&&h<270)return 'violet';
 if(h>=270&&h<335)return 'rose';
 if(h>=335&&h<355&&sat>.25)return 'rose';
 return 'earth';
}
function productShadeFamily(x,i=0){if(x.type==='single'&&x.brand==='Chantecaille'&&x.name==='Rhinoceros')return 'olive';return shadeFamily(x.type==='single'?x.color:x.shades[i]?.[1])}
function matchesColour(x,family){if(!family)return true;return Array.from({length:shadeCount(x)},(_,i)=>productShadeFamily(x,i)).includes(family)}
function frequentProductIds(){return new Set([...data].filter(x=>!x.archived&&x.type==='palette').sort((a,b)=>(Number(b.uses)||0)-(Number(a.uses)||0)).slice(0,5).map(x=>x.id))}

function backupSummary(obj){
 const products=obj.data.length, shades=obj.data.reduce((n,x)=>n+(x.type==='palette'?x.shades.length:1),0);

function validateBackup(obj){
 if(!obj||typeof obj!=='object'||!Array.isArray(obj.data)||!Array.isArray(obj.history))throw Error('Backup must contain both inventory and history arrays.');
 if(obj.data.length>10000||obj.history.length>100000)throw Error('Backup is unexpectedly large.');
 const ids=new Set();
 for(const x of obj.data){
  if(!x||typeof x.id!=='string'||!x.id.trim()||typeof x.brand!=='string'||!x.brand.trim()||typeof x.name!=='string'||!x.name.trim()||!['single','palette'].includes(x.type))throw Error('A product is missing its identity or type.');
  if(ids.has(x.id))throw Error('Duplicate product ID: '+x.id);ids.add(x.id);
  if(x.type==='palette'&&(!Array.isArray(x.shades)||!x.shades.length||x.shades.length>100||!x.shades.every(sh=>Array.isArray(sh)&&typeof sh[0]==='string'&&typeof sh[1]==='string')))throw Error('Invalid palette shades: '+x.name);
  if(x.type==='single'&&typeof x.color!=='string')throw Error('Missing single shade colour: '+x.name);
  if(x.uses!==undefined&&(!Number.isFinite(x.uses)||x.uses<0))throw Error('Invalid usage count: '+x.name);
  if(x.shadeUses!==undefined&&(!Array.isArray(x.shadeUses)||x.type!=='palette'||x.shadeUses.length!==x.shades.length||!x.shadeUses.every(n=>Number.isFinite(n)&&n>=0)))throw Error('Invalid per-shade counts: '+x.name);
 }
 for(const h of obj.history){if(!h||typeof h!=='object'||Array.isArray(h))throw Error('Invalid history entry.');}
 return obj;
}

// A private correction links only explicitly confirmed source entries; counts never change.
function applyLookLinkCorrection(patch){
 if(!Array.isArray(patch.expected)||patch.expected.length!==2||patch.expected.some(v=>!v||typeof v.id!=='string'||!Array.isArray(v.selection))||new Set(patch.expected.map(v=>v.id)).size!==2)throw Error('Invalid look correction.');
 const expected=JSON.parse(JSON.stringify(patch.expected)),ids=new Set(expected.map(v=>v.id));
 const already=history.find(h=>h.id===expected[0].id&&JSON.stringify(h.sourceRecords)===JSON.stringify(expected));
 if(already&&!history.some(h=>h.id===expected[1].id)){toast('This look correction is already applied.');return;}
 const verify=()=>expected.every(v=>history.filter(h=>h.id===v.id).length===1&&JSON.stringify(history.find(h=>h.id===v.id))===JSON.stringify(v));
 if(!verify())throw Error('These records have changed. No data was replaced. Export a fresh backup for review.');
 if(expected.some(h=>!validHistorySelection(h.selection)||!h.selection.length)||!journalDayKey(expected[0].date)||journalDayKey(expected[0].date)!==journalDayKey(expected[1].date))throw Error('The source look dates or shades need review.');
 const products=expected.map(h=>new Set(h.selection.map(v=>v.id)));if([...products[0]].some(id=>products[1].has(id)))throw Error('Overlapping product uses need a separate review. No counts were changed.');
 const names=expected.map(h=>[...new Set(h.selection.map(v=>data.find(x=>x.id===v.id).name))].join(' · '));
 diaryConfirm('Count as one look?',`${names.join(' + ')} · ${journalDayLabel(expected[0].date)}. Both entries will form one look. All product and shade use counts stay unchanged; original details are retained.`,()=>{
  if(!verify()){toast('The source records changed. Nothing was linked.');return;}
  if(!persistHistoryMutation(()=>{
   const first=Math.min(...expected.map(v=>history.findIndex(h=>h.id===v.id))),selection=expected.flatMap(h=>h.selection.map(v=>({...v})));
   const linked={...expected[0],selection,items:historyItemLabels(selection),sourceRecords:expected};
   history=history.filter(h=>!ids.has(h.id));history.splice(first,0,linked);if(lastSave&&ids.has(lastSave.id))lastSave=null;
  })){toast('Could not save the correction. No changes were kept.');return;}
  historyTab='looks';journalBrowse.query='';journalBrowse.month='';journalBrowse.notice='';go('history');toast('Entries linked. Usage counts unchanged.');
 },{confirmLabel:'Link look'});
}
async function importInventory(file){
 if(!file)return;
 const request=Symbol();window.__diaryImportRequest=request;let committed=false,stage='read';backupFeedback('Reading backup…');
 try{
  if(file.size>30*1024*1024)throw Error('Backup file is too large.');
  const text=await file.text();if(window.__diaryImportRequest!==request)return;stage='format';const incoming=JSON.parse(text);if(incoming?.type==='eyes_diary_look_link_v1'){applyLookLinkCorrection(incoming);return;}const obj=validateBackup(incoming);
  const current={version:3,exportedAt:new Date().toISOString(),data,history,lastSave};
  const message=`Import this backup?\n\nIncoming: ${backupSummary(obj)}\nCurrent: ${backupSummary(current)}\n\nThis will replace the current collection and history. A safety copy of the current data will be downloaded first.`;
  if(!confirm(message)){backupFeedback('Import cancelled. Current data is unchanged.');return;}stage='save';
  // Keep a recoverable copy in localStorage before replacing anything.
  const previous=localStorage.getItem('eyes_official_v1');
  if(previous!==null)localStorage.setItem('eyes_diary_pre_import_backup',previous);
  else localStorage.setItem('eyes_diary_pre_import_backup',JSON.stringify({data,history,lastSave}));
  downloadBackupPayload(current,'eyeshadow-diary-before-import.json');
  const next={data:obj.data,history:obj.history,lastSave:null};
  // Commit to storage first; only switch live state if writing succeeds.
  try{localStorage.setItem('eyes_official_v1',JSON.stringify(next))}
  catch(e){if(previous!==null)localStorage.setItem('eyes_official_v1',previous);throw e}
  committed=true;data=next.data;history=next.history;lastSave=null;selected=[];
  go('collection');toast('Backup imported');
 }catch(error){if(window.__diaryImportRequest!==request)return;const message=committed?'Backup imported. Reopen Collection to view it.':file.size>30*1024*1024?'This backup is too large. Choose a file under 30 MB.':stage==='read'?'Could not read this file. Choose it again.':stage==='format'?'This file is not a valid diary backup. Choose an exported JSON backup.':'Could not save the import. Current data is unchanged. Export a backup before trying again.';backupFeedback(message,!committed)}
}

function classifyShadowColour(hex){
 if(typeof hex!=='string'||!/^#[0-9a-f]{6}$/i.test(hex))return null;
 let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
 let hi=Math.max(r,g,b),lo=Math.min(r,g,b),d=hi-lo;
 if(d<0.085)return 'neutral';
 let h=0;
 if(hi===r)h=((g-b)/d)%6;
 else if(hi===g)h=(b-r)/d+2;
 else h=(r-g)/d+4;
 h=(h*60+360)%360;
 if(h>=68&&h<172)return 'green';
 if(h>=172&&h<266)return 'purple';
 if(h>=266&&h<330)return h<290?'purple':'pink';
 if(h>=330||h<12)return (r-b<0.13&&r-g<0.17)?'pink':'pink';
 if(h>=12&&h<48)return 'neutral';
 if(h>=48&&h<68)return 'neutral';
 return 'neutral';
}

function resolveLegacySelection(h){
 if(!Array.isArray(h.items)||!h.items.length)return null;
 const result=[];
 for(const raw of h.items){
  const label=String(raw).trim(),matches=[];
  for(const x of data){

     if(label===x.name+' '+shade[0]||label===x.brand+' '+x.name+' '+shade[0])matches.push({id:x.id,index});
    });
   }
  }
  if(matches.length!==1)return null;

// v89: pull down from the very top to refresh. Do not intercept normal scrolling,
// inputs, or horizontal swipes; preserve the current screen and archive filters.
(function enablePullRefresh(){

 document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return reset();
  const target=e.target;
  if(diaryModalOpen240()||target.closest('input,textarea,select,[contenteditable="true"],.modal,dialog,[role="dialog"]'))return reset();

// v91: right-edge left swipe = back. At Archive root, go to Home.
// Ignore gestures starting on controls or horizontal palette/carousel elements.
(function enableEdgeSwipeBack(){

 document.addEventListener('touchstart',e=>{
  armed=false;
  if(diaryModalOpen240()||e.touches.length!==1)return;
  const t=e.touches[0],w=window.innerWidth;

 },{passive:true});

})();
